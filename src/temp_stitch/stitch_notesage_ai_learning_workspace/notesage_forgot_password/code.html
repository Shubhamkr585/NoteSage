<style>
        .glass-morphism {
            background: rgba(18, 33, 49, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .primary-gradient-bg {

        }

        .input-glow:focus-within {
            box-shadow: 0 0 15px rgba(208, 188, 255, 0.15);
        }
        
        body {
            background: radial-gradient(circle at top right, #0d1c2d, #051424);
            overflow-x: hidden;
        }

        .floating-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(109, 59, 215, 0.1) 0%, transparent 70%);
            z-index: 0;
            filter: blur(60px);
        }

<body class="min-h-screen flex items-center justify-center p-6 text-on-surface">
<!-- Background Decoration -->
<div class="floating-orb -top-20 -left-20 animate-pulse"></div>
<div class="floating-orb -bottom-40 -right-20 animate-pulse" style="animation-delay: 2s;"></div>
<!-- Main Content Shell -->
<main class="relative z-10 w-full max-w-[440px]">
<!-- Branding Anchor -->
<div class="flex flex-col items-center mb-8 gap-2">
<div class="w-12 h-12 rounded-xl primary-gradient-bg flex items-center justify-center shadow-lg shadow-primary/20 mb-2 transform hover:rotate-6 transition-transform duration-300 cursor-pointer">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">biotech</span>
</div>
<h1 class="font-display text-headline-md font-bold text-primary tracking-tight">NoteSage</h1>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-[0.2em]">AI Workspace</p>
</div>
<!-- Glassmorphic Reset Card -->
<div class="glass-morphism rounded-3xl p-8 md:p-10 shadow-2xl relative overflow-hidden group">
<!-- Decorative Inner Glow -->
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
<div class="relative z-10">
<div class="mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your email to receive a password reset link.</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-primary/80 px-1" for="email">Email Address</label>
<div class="relative flex items-center input-glow transition-all duration-300">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant/50 text-[20px]">mail</span>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/30 transition-colors" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<button class="w-full primary-gradient-bg text-on-primary py-4 px-6 rounded-xl font-label-md text-label-md font-bold shadow-lg shadow-primary/20 hover:shadow-primary/40 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group/btn" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-10 flex flex-col items-center gap-6">
<div class="w-full h-px bg-white/5 relative">
<span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#0d1c2d] px-3 font-label-sm text-label-sm text-on-surface-variant/40">OR</span>
</div>
<a class="inline-flex items-center gap-2 text-primary font-label-md text-label-md hover:text-primary-container transition-colors duration-200 group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">chevron_left</span>
                        Back to Sign In
                    </a>
</div>
</div>
</div>
<!-- Footer Help Link -->
<div class="mt-8 flex justify-center">
<button class="flex items-center gap-2 px-4 py-2 rounded-full hover:bg-white/5 transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant/60 text-[18px]">help_outline</span>
<span class="font-label-sm text-label-sm text-on-surface-variant/60 group-hover:text-on-surface transition-colors">Need support? Contact help desk</span>
</button>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const submitBtn = form.querySelector('button[type="submit"]');
            const emailInput = document.getElementById('email');

            form.addEventListener('submit', (e) => {
                const originalContent = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = `
                    <svg class="animate-spin h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Sending...</span>
                `;

                // Simulate API call
                setTimeout(() => {
                    submitBtn.classList.remove('primary-gradient-bg');
                    submitBtn.classList.add('bg-secondary-container');
                    submitBtn.innerHTML = `
                        <span class="material-symbols-outlined text-[18px]">check_circle</span>
                        <span>Link Sent!</span>
                    `;
                    
                    // Shake effect on success
                    const card = document.querySelector('.glass-morphism');
                    card.classList.add('translate-y-[-4px]');
                    
                    setTimeout(() => {
                        card.classList.remove('translate-y-[-4px]');
                        // Reset form after delay
                        setTimeout(() => {
                            submitBtn.disabled = false;
                            submitBtn.classList.add('primary-gradient-bg');
                            submitBtn.classList.remove('bg-secondary-container');
                            submitBtn.innerHTML = originalContent;
                            emailInput.value = '';
                        }, 2000);
                    }, 200);
                }, 1500);
            });

            // Ambient movement for orbs
            const orbs = document.querySelectorAll('.floating-orb');
            window.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                orbs.forEach((orb, index) => {
                    const factor = (index + 1) * 20;
                    orb.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
                });
            });
        });
    </script>
</body></html>
