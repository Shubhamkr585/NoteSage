</div>
</div>

</div>
</div>
</div>

<!-- Custom Cursor Effect -->
<div class="fixed w-[400px] h-[400px] bg-primary rounded-full blur-[100px] opacity-0 pointer-events-none -translate-x-1/2 -translate-y-1/2 mix-blend-screen transition-opacity duration-700" id="cursor-glow"></div>
<script>
        // Atmospheric Mouse Movement
        const glow = document.getElementById('cursor-glow');
        let currentX = 0;
        let currentY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
            glow.style.opacity = '0.08';
        });

        document.addEventListener('mouseleave', () => {
            glow.style.opacity = '0';
        });

        function animate() {
            currentX += (targetX - currentX) * 0.05;
            currentY += (targetY - currentY) * 0.05;
            
            glow.style.left = `${currentX}px`;
            glow.style.top = `${currentY}px`;
            
            requestAnimationFrame(animate);
        }
        animate();

        // Subtle form interactions
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('border-primary/50');
                input.parentElement.classList.remove('border-outline-variant');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('border-primary/50');
                input.parentElement.classList.add('border-outline-variant');
            });
        });
    </script>
